# F02.1 source inventory. Payloads are never stored in this repository.
schema = 2
cache_root = "$XDG_CACHE_HOME"
cache_note = "Resolve local_cache under this external root; F02.2 owns fetching."
required_families = [
  "linux-uapi", "mesa-virgl", "mesa-venus",
  "virglrenderer", "venus-protocol", "gl-gles-registry",
  "glsl", "essl", "vulkan", "spirv", "webgpu", "wgsl",
  "vk-gl-cts", "webgpu-cts", "piglit",
]
input_files = ["inputs/part-0001.toml"]
