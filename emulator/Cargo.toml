[package]
name = "emulator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WebBoxVM core emulator — ARM64/x86_64 CPU, MMU, and devices"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
wasm-bindgen = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "ddd322514d87a4b21342b7ab9a9d70796fc60576", optional = true }
disarm64 = "0.1.26"
ext4-view = { version = "0.9.3", default-features = false }
flate2 = "1"
ruzstd = "0.8.3"

[features]
default = []
wasm = ["wasm-bindgen"]

[dev-dependencies]
crossterm = "0.28"
