permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Emit an immutable-blob ptrace witness
        run: |
          set -euo pipefail
          rel='todo/graphics/00-foundation/01-contract/02-upstream-pins/04-profile-source-inputs/04-atomic-admission/01-admission-shape/05-aggregate-shape/02-vulkan-docs-closure/03-bind-vulkan-docs/05-actual-closure-proof/02-proof-lineage-trace/lineage_github_witness.py'
          git -C "$GITHUB_WORKSPACE" cat-file blob "$GITHUB_SHA:$rel" > "$RUNNER_TEMP/lineage_github_witness.py"
          set +e
          detail="$(python3 -I "$RUNNER_TEMP/lineage_github_witness.py" "$GITHUB_WORKSPACE" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$detail"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Docs lineage witness failed::${detail//$'\n'/ }"
            exit "$status"
          fi
          echo "::notice title=Docs lineage ptrace witness::$detail"
      - name: Emit a pinned-image Docker ptrace primitive witness
        run: |
          set -euo pipefail
          rel='todo/graphics/00-foundation/01-contract/02-upstream-pins/04-profile-source-inputs/04-atomic-admission/01-admission-shape/05-aggregate-shape/02-vulkan-docs-closure/03-bind-vulkan-docs/05-actual-closure-proof/02-proof-lineage-trace/lineage_github_docker_witness.py'
          git -C "$GITHUB_WORKSPACE" cat-file blob "$GITHUB_SHA:$rel" > "$RUNNER_TEMP/lineage_github_docker_witness.py"
          set +e
          detail="$(python3 -I "$RUNNER_TEMP/lineage_github_docker_witness.py" "$GITHUB_WORKSPACE" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$detail"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Docs pinned-image Docker primitive failed::${detail//$'\n'/ }"
            exit "$status"
          fi
          echo "::notice title=Docs pinned-image Docker ptrace primitive::$detail"
      - name: Emit a pinned-image synthetic syscall collector witness
        run: |
          set -euo pipefail
          rel='todo/graphics/00-foundation/01-contract/02-upstream-pins/04-profile-source-inputs/04-atomic-admission/01-admission-shape/05-aggregate-shape/02-vulkan-docs-closure/03-bind-vulkan-docs/05-actual-closure-proof/02-proof-lineage-trace/lineage_github_synthetic_witness.py'
          git -C "$GITHUB_WORKSPACE" cat-file blob "$GITHUB_SHA:$rel" > "$RUNNER_TEMP/lineage_github_synthetic_witness.py"
          set +e
          detail="$(python3 -I "$RUNNER_TEMP/lineage_github_synthetic_witness.py" "$GITHUB_WORKSPACE" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$detail"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Synthetic syscall collector witness failed::${detail//$'\n'/ }"
            exit "$status"
          fi
          echo "::notice title=Synthetic syscall collector witness::$detail"
