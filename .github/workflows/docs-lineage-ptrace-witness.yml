name: Docs lineage ptrace witness

on:
  push:
    branches: [codex/graphics-f01-baseline]
    paths:
      - .github/workflows/docs-lineage-ptrace-witness.yml
      - todo/graphics/00-foundation/01-contract/02-upstream-pins/04-profile-source-inputs/04-atomic-admission/01-admission-shape/05-aggregate-shape/02-vulkan-docs-closure/03-bind-vulkan-docs/05-actual-closure-proof/02-proof-lineage-trace/**

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Emit an immutable-blob ptrace witness
        run: |
          set -euo pipefail
          rel='todo/graphics/00-foundation/01-contract/02-upstream-pins/04-profile-source-inputs/04-atomic-admission/01-admission-shape/05-aggregate-shape/02-vulkan-docs-closure/03-bind-vulkan-docs/05-actual-closure-proof/02-proof-lineage-trace/lineage_github_witness.py'
          git -C "$GITHUB_WORKSPACE" cat-file blob "$GITHUB_SHA:$rel" > "$RUNNER_TEMP/lineage_github_witness.py"
          python3 -I "$RUNNER_TEMP/lineage_github_witness.py" "$GITHUB_WORKSPACE"
