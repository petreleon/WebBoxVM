<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebBoxVM</title>
    <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css">
    <link rel="stylesheet" href="./styles.css">
    <script defer crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@xterm/xterm/lib/xterm.js"></script>
    <script defer crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script type="module" src="./app.js?v=20260904-virgl-depth-vertex-color-r1"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>WebBoxVM</h1>
          <p id="statusLine">Idle</p>
        </div>
        <dl class="metrics">
          <div>
            <dt>Steps</dt>
            <dd id="stepsValue">0</dd>
          </div>
          <div>
            <dt>PC</dt>
            <dd id="pcValue">0x0</dd>
          </div>
          <div>
            <dt>UART</dt>
            <dd id="uartValue">0 B</dd>
          </div>
          <div>
            <dt>Pages</dt>
            <dd id="pagesValue">0</dd>
          </div>
          <div>
            <dt>Net</dt>
            <dd id="netValue">Off</dd>
          </div>
          <div>
            <dt>Disk</dt>
            <dd id="diskValue">0 B</dd>
          </div>
          <div>
            <dt>Saved</dt>
            <dd id="savedValue">Off</dd>
          </div>
        </dl>
      </header>

      <section class="workspace">
        <aside class="controls" aria-label="VM controls">
          <label class="field">
            <span>ISO image</span>
            <input id="isoFile" type="file" accept=".iso,application/x-iso9660-image">
          </label>

          <div class="button-row">
            <button id="bootIso" type="button">Boot ISO</button>
            <button id="bootDebian" type="button">Boot Debian</button>
          </div>

          <div class="button-row">
            <button id="pauseVm" type="button" disabled>Pause</button>
            <button id="resumeVm" type="button" disabled>Resume</button>
            <button id="resetVm" type="button" disabled>Reset</button>
          </div>

          <label class="field">
            <span>Step slice</span>
            <input id="stepSlice" type="number" min="1000" max="50000000" step="1000" value="5000000">
          </label>

          <label class="field">
            <span>Writable disk GiB</span>
            <input id="diskSize" type="number" min="1" max="64" step="1" value="4">
          </label>

          <div class="button-row">
            <button id="saveDisk" type="button" disabled>Save disk</button>
            <button id="bootDisk" type="button" disabled>Boot disk</button>
            <button id="clearDisk" type="button" disabled>Clear saved</button>
          </div>

          <label class="toggle">
            <input id="autoScroll" type="checkbox" checked>
            <span>Autoscroll</span>
          </label>

          <pre id="eventLog" class="event-log" aria-label="Event log"></pre>
        </aside>

        <section class="guest-io">
          <section class="display-pane" aria-label="Guest graphical display">
            <header class="display-header">
              <h2>Guest display</h2>
              <span
                id="displayStatus"
                data-testid="webboxvm-display-status"
                data-backend="none"
                data-acceleration-path="2d-scanout"
                data-three-d-acceleration="inactive"
                data-three-d-capset-id="7"
                data-three-d-frames-received="0"
                data-three-d-draws="0"
                data-three-d-errors="0"
                data-three-d-last-error=""
                data-three-d-last-sequence=""
                data-adapter="unknown"
                data-adapter-vendor=""
                data-adapter-architecture=""
                data-adapter-description=""
                data-device-generation="0"
                data-fallback-adapter="unknown"
                data-frames-received="0"
                data-uploads="0"
                data-last-error=""
              >Waiting for guest display</span>
            </header>
            <canvas
              id="displayCanvas"
              data-testid="webboxvm-display-canvas"
              width="640"
              height="480"
            ></canvas>
          </section>

          <section class="terminal-pane" aria-label="Guest serial console">
            <div id="terminal"></div>
            <pre id="jitStatsValue" data-testid="webboxvm-jit-stats" hidden></pre>
            <pre id="currentInstructionValue" data-testid="webboxvm-current-instruction" hidden></pre>
          </section>
        </section>
      </section>
    </main>
  </body>
</html>
